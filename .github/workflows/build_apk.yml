name: Build Modern ARM64 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Cloud Compile arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build arm64-v8a APK (Supported modern binaries only)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --android-skip-build-dependency-validation

      - name: Rename & Prepare APK Artifact
        run: |
          mkdir -p output
          find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} output/HID_Tool_arm64.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HID_Tool_arm64_Release
          path: output/HID_Tool_arm64.apk
          retention-days: 14
